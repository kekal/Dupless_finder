server {
    listen 8888;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust Cloudflare Tunnel proxy for real client IPs
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # Required for Blazor WASM + OpenCV WASM threading
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' https:;" always;

    # Include default MIME types, then add custom ones
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream dll blat dat;
        application/javascript mjs;
    }

    # Gzip compression
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css application/octet-stream;

    # Blazor WASM SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # blazor.boot.json must never be cached (controls app versioning)
    location = /_framework/blazor.boot.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        # Re-add COOP/COEP/CSP since add_header in location blocks replaces parent
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' https:;" always;
    }

    # Cache static assets
    location ~* \.(wasm|dll|blat|dat|js|mjs|css|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        # Re-add COOP/COEP/CSP since add_header in location blocks replaces parent
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' https:;" always;
    }
}
