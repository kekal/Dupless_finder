services:
  dupless-finder:
    build: .
    container_name: dupless-finder
    ports:
      - "8888:8888"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8888"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
